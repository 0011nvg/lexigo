name: LEXIGO browser journeys
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright pdf-lib
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 &
      - run: node tests/verify.mjs
      - run: node tests/journeys.mjs
      - run: node tests/navigation.mjs
      - run: node tests/learning.mjs
      - run: node tests/visual-smoke.mjs
      - run: node tests/integration-print.mjs
      - name: Prepare isolated static preview package
        if: success()
        run: |
          mkdir -p static-preview
          cp index.html navigation.css navigation-controller.js practice-controller.js game-components.js game-engine.js local-storage.js local-game-adapter.js data.js static-preview/
          printf '%s\n' 'LEXIGO PR #8 static preview' 'Unzip and open index.html; for best results use a local HTTP server.' 'No Supabase cabinet or production deployment is included.' > static-preview/README.txt
      - name: Upload isolated static preview (no deployment)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lexigo-pr8-static-preview
          path: static-preview/
          retention-days: 14
      - name: Upload browser screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexigo-browser-screenshots
          path: test-results/
          if-no-files-found: ignore
