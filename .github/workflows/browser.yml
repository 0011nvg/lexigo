name: LEXI browser journeys
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright pdf-lib
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y poppler-utils
      - run: python3 -m http.server 4173 --bind 127.0.0.1 &
      - run: node tests/verify.mjs
      - run: node tests/inventory.mjs
      - run: node tests/crystal-policy.mjs
      - run: node tests/crystal-webkit.mjs
      - run: node tests/progress-model.mjs
      - run: node tests/dashboard.mjs
      - run: node tests/results.mjs
      - run: node tests/journeys.mjs
      - run: node tests/navigation.mjs
      - run: node tests/learning.mjs
      - run: node tests/visual-smoke.mjs
      - run: node tests/integration-print.mjs
      - run: node tests/world.mjs
      - run: node tests/plus.mjs
      - run: node tests/print-layout.mjs
      - run: LEXIGO_WEBKIT=1 node tests/personal.mjs
      - name: Prepare isolated static preview package
        if: success()
        run: |
          mkdir -p static-preview
          cp index.html result.css result-ui.js dashboard.css progress-model.js progress-ui.js premium.css navigation.css navigation-controller.js practice-controller.js game-components.js game-engine.js local-storage.js local-game-adapter.js data.js whole-book.js lexi-world.js world.css lexi-live.js polish.css print.css lexigo-plus.js personal.js account-hint.js config.js cloud-core.js cloud.js auth.html auth.js me.html me.js account.css privacy.html consent.html manifest.webmanifest static-preview/
          cp -r assets vocabulary vendor static-preview/
          printf '%s\n' 'LEXI Spotlight 2–9 static preview' 'Unzip and open index.html; for best results use a local HTTP server.' 'Cloud accounts stay off until config.js is filled in (see docs/CLOUD-SETUP.md).' > static-preview/README.txt
      - name: Upload isolated static preview (no deployment)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lexi-spotlight-2-9-static-preview
          path: static-preview/
          retention-days: 14
      - name: Upload browser screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexi-browser-screenshots
          path: test-results/
          if-no-files-found: ignore
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 &
      - name: Local Supabase stack (Auth + PostgREST + PostgreSQL)
        run: |
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1) tests/e2e/start-local-supabase.sh > /tmp/stack.env
      - name: Access rules and XP (SQL)
        run: PGHOST=/tmp/lexigo-supabase PGPORT=54329 PGUSER=postgres tests/sql/run.sh
      - name: Cloud journey (browser)
        run: |
          . /tmp/stack.env
          node tests/e2e/cloud-journey.mjs
