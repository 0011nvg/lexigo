name: LEXI browser journeys
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright pdf-lib
      - run: npx playwright install --with-deps chromium webkit
      - run: sudo apt-get install -y poppler-utils
      - run: python3 -m http.server 4173 --bind 127.0.0.1 &
      - run: node tests/verify.mjs
      - run: node tests/balanced-groups.mjs
      - run: node tests/retry-policy.mjs
      - run: node tests/attempt-history.mjs
      - run: node tests/lexi-next.mjs
      - run: node tests/history-cabinets.mjs
      - run: node tests/inventory.mjs
      - run: node tests/crystal-engine.mjs
      - run: LEXIGO_WEBKIT=1 node tests/crystal-play.mjs
      - run: node tests/progress-model.mjs
      - run: node tests/dashboard.mjs
      - run: node tests/results.mjs
      - run: node tests/journeys.mjs
      - run: node tests/navigation.mjs
      - run: node tests/learning.mjs
      - run: node tests/visual-smoke.mjs
      - run: node tests/integration-print.mjs
      - run: node tests/world.mjs
      - run: node tests/plus.mjs
      - run: node tests/print-layout.mjs
      - run: LEXIGO_WEBKIT=1 node tests/personal.mjs
      - run: node tests/rules.mjs
      - run: node tests/word-builder.mjs
      - run: node tests/builder-play.mjs
      - run: node tests/rounds.mjs
      - run: node tests/book-context.mjs
      - run: node tests/cloud-down.mjs
      - run: LEXIGO_WEBKIT=1 node tests/text-audit.mjs
      - run: node tests/home-progress.mjs
      - run: node tests/teacher-share.mjs
      - run: node tests/links-type-speech.mjs
      - name: Prepare isolated static preview package
        if: success()
        run: |
          node scripts/package-static.mjs
      - name: Upload isolated static preview (no deployment)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lexi-spotlight-2-9-static-preview
          path: static-preview/
          retention-days: 14
      - name: Upload browser screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexi-browser-screenshots
          path: test-results/
          if-no-files-found: ignore
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 &
      - name: Local Supabase stack (Auth + PostgREST + PostgreSQL)
        run: |
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1) tests/e2e/start-local-supabase.sh > /tmp/stack.env
      - name: Access rules and XP (SQL)
        run: PGHOST=/tmp/lexigo-supabase PGPORT=54329 PGUSER=postgres tests/sql/run.sh
      - name: Cloud journey (browser)
        run: |
          . /tmp/stack.env
          node tests/e2e/cloud-journey.mjs
      - name: Teacher lessons and lesson pages (browser)
        run: |
          . /tmp/stack.env
          node tests/e2e/teacher-lessons.mjs
          node tests/e2e/lesson-pages.mjs
      - name: Russian auth e-mails (local GoTrue + SMTP sink)
        run: |
          . /tmp/stack.env
          node tests/e2e/email-flow.mjs
      - name: Crystal expedition rating (browser + server)
        run: |
          . /tmp/stack.env
          node tests/e2e/crystal-rating.mjs
      - name: Rounds in blocks continue on another device (browser + server)
        run: |
          . /tmp/stack.env
          node tests/e2e/rounds-cloud.mjs
