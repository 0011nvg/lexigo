name: LEXIGO browser journeys
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 &
      - run: node tests/verify.mjs
      - run: node tests/journeys.mjs
      - run: node tests/learning.mjs
      - run: node tests/visual-smoke.mjs
      - name: Upload browser screenshots and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexigo-browser-screenshots
          path: test-results/
          if-no-files-found: ignore
