name: Deploy LEXI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright pdf-lib @electric-sql/pglite@0.5.15
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 4173 --bind 127.0.0.1 &
      - name: Verify data, learning rules and isolated database
        run: |
          node tests/verify.mjs
          node tests/inventory.mjs
          node tests/balanced-groups.mjs
          node tests/retry-policy.mjs
          node tests/attempt-history.mjs
          node tests/sql/core.mjs
      - name: Verify critical browser journeys and A4 output
        run: |
          node tests/lexi-next.mjs
          node tests/history-cabinets.mjs
          node tests/learning.mjs
          node tests/plus.mjs
          node tests/rounds.mjs
          node tests/print-layout.mjs
          node tests/integration-print.mjs
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
