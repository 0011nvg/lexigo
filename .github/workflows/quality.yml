name: LEXI quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/verify.mjs
      - run: node tests/materials.mjs
      - run: node tests/balanced-groups.mjs
      - run: node tests/retry-policy.mjs
      - run: node tests/attempt-history.mjs
      - run: node tests/inventory.mjs
      - run: node tests/word-builder.mjs
      - run: node tests/crystal-engine.mjs
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @electric-sql/pglite@0.5.15
      - run: node tests/sql/core.mjs
