name: LEXIGO quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/verify.mjs
      - run: node tests/stage5-security.mjs

      - run: node tests/stage5-jwt.mjs
