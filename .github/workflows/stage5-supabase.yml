name: LEXIGO real local Supabase integration
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/stage5-supabase-e2e.mjs'
      - 'tests/stage7-real-browser.mjs'
      - 'tests/integration-print.mjs'
      - 'index.html'
      - '*-controller.js'
      - '*-storage.js'
      - 'game-components.js'
      - 'game-engine.js'
      - 'server-game-adapter.js'
      - 'local-game-adapter.js'
      - 'tests/browser-runtime.mjs'
      - 'tests/shared-modes-browser.mjs'
      - 'tests/teacher-workspace-browser.mjs'
      - 'tests/mastery-browser.mjs'
      - 'stage7-local-cabinet.html'
      - '.github/workflows/stage5-supabase.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supabase-local:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTTP E2E JavaScript syntax before starting Docker
        run: node --check tests/stage5-supabase-e2e.mjs
      - name: Start isolated Supabase Auth, PostgREST and PostgreSQL
        run: supabase start -x studio,imgproxy,inbucket,storage-api,realtime,analytics,vector,edge-runtime
      - name: Apply migrations
        run: supabase db reset --local
      - name: Cache Edge Runtime image via Docker Hub mirror
        run: |
          docker pull supabase/edge-runtime:v1.77.4
          docker tag supabase/edge-runtime:v1.77.4 public.ecr.aws/supabase/edge-runtime:v1.77.4
      - name: Start Edge Function locally
        run: |
          supabase functions serve learning-api --no-verify-jwt > /tmp/lexigo-edge.log 2>&1 &
          echo $! > /tmp/lexigo-edge.pid
      - name: Wait for Edge Function to become ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/learning-api/create-assignment -H 'content-type: application/json' -d '{}' || true)
            if [ "$code" = "401" ]; then echo 'Edge ready'; exit 0; fi
            sleep 2
          done
          echo 'Edge failed to start'; tail -100 /tmp/lexigo-edge.log; exit 1
      - name: Exercise Auth-issued JWT and Edge HTTP requests
        run: |
          supabase status -o env > /tmp/lexigo-local-env
          set -a
          source /tmp/lexigo-local-env
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          set +a
          node tests/stage5-supabase-e2e.mjs
      - name: Install Chromium for real cabinet journey
        run: |
          npm install --no-save playwright pdf-lib
          npx playwright install --with-deps chromium
      - name: Start local cabinet web origin
        run: python3 -m http.server 3000 --bind 127.0.0.1 &
      - name: Real browser login, RLS reads and logout
        run: |
          supabase status -o env > /tmp/lexigo-local-env
          set -a
          source /tmp/lexigo-local-env
          export SUPABASE_ANON_KEY="$ANON_KEY"
          set +a
          node tests/stage7-real-browser.mjs
          node tests/shared-modes-browser.mjs
          node tests/teacher-workspace-browser.mjs
          node tests/mastery-browser.mjs
      - name: Verify real A4 PDFs for 5, 10, 20, 25, and 30 questions
        run: node tests/integration-print.mjs
      - name: Edge diagnostics on failure
        if: failure()
        run: tail -100 /tmp/lexigo-edge.log || true
      - name: Stop disposable local stack
        if: always()
        run: supabase stop --no-backup || true
