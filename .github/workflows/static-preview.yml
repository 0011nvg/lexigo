name: LEXIGO isolated static preview package
on:
  pull_request:
    paths:
      - 'index.html'
      - 'premium.css'
      - 'assets/**'
      - 'navigation.css'
      - 'navigation-controller.js'
      - 'practice-controller.js'
      - 'game-components.js'
      - 'game-engine.js'
      - 'local-storage.js'
      - 'local-game-adapter.js'
      - 'data.js'
      - '.github/workflows/static-preview.yml'
permissions:
  contents: read
jobs:
  preview-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static preview has no server entry points
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'server-storage\.js|server-game-adapter\.js|cabinet-controller\.js|Supabase Auth' index.html
          test -f data.js
          node tests/verify.mjs
      - name: Package only public local-game files (never deploy)
        run: |
          mkdir -p static-preview
          cp index.html premium.css navigation.css navigation-controller.js practice-controller.js game-components.js game-engine.js local-storage.js local-game-adapter.js data.js static-preview/
          cp -r assets static-preview/
          printf '%s\n' 'LEXIGO static preview — PR #8' 'Extract and open index.html in a browser. For full routing support, run a local HTTP server in this folder (python3 -m http.server 4173).' 'This package contains no server cabinet or Supabase configuration.' > static-preview/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: lexigo-pr8-static-preview
          path: static-preview/
          retention-days: 14
