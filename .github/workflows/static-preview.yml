name: LEXI isolated static preview package
on:
  pull_request:
    paths:
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'scripts/package-static.mjs'
      - 'premium.css'
      - 'dashboard.css'
      - 'result.css'
      - 'result-ui.js'
      - 'progress-model.js'
      - 'progress-ui.js'
      - 'assets/**'
      - 'navigation.css'
      - 'navigation-controller.js'
      - 'practice-controller.js'
      - 'game-components.js'
      - 'game-engine.js'
      - 'local-storage.js'
      - 'local-game-adapter.js'
      - 'data.js'
      - 'lexi-world.js'
      - 'world.css'
      - 'vocabulary/**'
      - 'polish.css'
      - 'print.css'
      - 'lexigo-plus.js'
      - 'personal.js'
      - 'lexi-live.js'
      - 'cloud*.js'
      - 'word-builder.js'
      - 'my-lessons.js'
      - 'lessons.css'
      - 'crystal-*'
      - 'crystal.css'
      - 'account*'
      - 'auth.*'
      - 'me.*'
      - '.github/workflows/static-preview.yml'
permissions:
  contents: read
jobs:
  preview-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check static preview has no server entry points
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'server-storage\.js|server-game-adapter\.js|cabinet-controller\.js|Supabase Auth' index.html
          test -f data.js
          node tests/verify.mjs
      - name: Package only public local-game files (never deploy)
        run: |
          node scripts/package-static.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lexi-spotlight-2-9-static-preview
          path: static-preview/
          retention-days: 14
