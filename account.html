<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Аккаунт — LEXIGO</title><link rel="stylesheet" href="account.css"></head><body><header><a href="index.html">LEXI<b>GO</b></a><span>Личный кабинет</span></header><main><section id="auth"><h1>Добро пожаловать</h1><p>Войди в аккаунт или создай новый.</p><form id="accountForm"><label>Электронная почта<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" minlength="12" required></label><fieldset id="registration" hidden><legend>Новый аккаунт</legend><label>Никнейм<input name="nickname" maxlength="40"></label><label>Роль<select name="role"><option value="student">Ученик</option><option value="teacher">Учитель</option></select></label><p>14 дней Plus без карты. Автоматических списаний нет.</p></fieldset><button id="submit">Войти</button><button type="button" id="switch" class="secondary">Создать аккаунт</button><button type="button" id="reset" class="secondary">Восстановить доступ</button></form></section><section id="dashboard" hidden><h1 id="greeting"></h1><p id="entitlement"></p><p>Синхронизация игрового прогресса ещё не подключена к этому кабинету.</p><button id="logout">Выйти</button></section><p id="status" role="status" aria-live="polite"></p></main><script src="account-config.js"></script><script src="account.js"></script></body></html>
